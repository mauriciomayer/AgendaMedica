# For details on how to configure this file, see:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "agenda-medica"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Doctors are auto-confirmed by the register-doctor Edge Function (createUser with
# email_confirm: true) — no confirmation email flow is part of this story's scope.
enable_confirmations = false

[edge_runtime]
enabled = true

[functions.register-doctor]
verify_jwt = false
